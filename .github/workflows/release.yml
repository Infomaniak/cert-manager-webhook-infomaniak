# GoReleaser release workflow.
name: Release

# Creates a release when a tag that matches the pattern "v*" (e.g. v0.2.1)
# is created: multi-arch container image on ghcr.io, GPG-signed checksums
# and the Helm-rendered manifest as release asset.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents,
# and to push the container image to ghcr.io.
permissions:
  contents: write
  packages: write

env:
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install GPG key
        if: env.GPG_PRIVATE_KEY != ''
        uses: crazy-max/ghaction-import-gpg@cb9bde2e2525e640591a934b1fd28eef1dcaf5e5 # v6.2.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          fingerprint: ${{ secrets.FINGERPRINT }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3 # v6.2.1
        with:
          args: release --clean ${{ env.GPG_PRIVATE_KEY == '' && '--skip=sign' || '' }}
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Push Helm chart to OCI registry
        env:
          HELM_REGISTRY: ghcr.io
          HELM_REPO: ${{ github.repository }}
          HELM_USER: ${{ github.actor }}
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HELM_REPO="$(echo "$HELM_REPO" | tr '[:upper:]' '[:lower:]')"
          echo "$HELM_PASSWORD" | helm registry login "$HELM_REGISTRY" -u "$HELM_USER" --password-stdin
          helm push dist/infomaniak-webhook-*.tgz "oci://$HELM_REGISTRY/$HELM_REPO"
